{{- /* chezmoi:modify-template */ -}}
{{- if .chezmoi.stdin -}}
{{- $managedBlock := `(?ms)\n?# BEGIN chezmoi: Emacs MCP\n.*?# END chezmoi: Emacs MCP\n?` -}}
{{- $config := regexReplaceAll $managedBlock .chezmoi.stdin "" | trimSuffix "\n" -}}
{{ $config }}

# BEGIN chezmoi: Emacs MCP
[mcp_servers.emacs]
command = "uv"
args = ["--directory", "{{ .chezmoi.homeDir }}/src/github.com/jesse-c/emacs-mcp-server", "run", "emacs-mcp-server"]
startup_timeout_sec = 30
# END chezmoi: Emacs MCP
{{- end }}
